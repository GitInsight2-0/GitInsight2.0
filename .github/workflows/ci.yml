# PR과 main push마다 AGENTS.md "명령"의 기본 검사를 실행합니다.
# network, live_llm 테스트는 루트 pyproject.toml의 pytest 설정으로 빠지므로 API 키가 필요 없습니다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR에 새 커밋이 오면 이전 실행을 취소합니다.
# main push는 취소하지 않아서, 연달아 머지해도 커밋마다 결과가 남습니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # postgres 표시 테스트용 DB입니다. 기본 pytest는 DB 없이 돕니다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gitinsight
          POSTGRES_PASSWORD: gitinsight
          POSTGRES_DB: gitinsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitinsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Python 버전은 .python-version(3.12)을 따릅니다.
      - name: Set up uv
        # setup-uv는 주 버전 태그(v10)를 내지 않아 전체 버전을 씁니다.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
      # 실제 Postgres에서 마이그레이션 왕복, tables.py와의 일치, 저장소 쿼리를 확인합니다.
      - name: Pytest (Postgres)
        run: uv run pytest -m postgres
        env:
          TEST_DATABASE_URL: postgresql://gitinsight:gitinsight@localhost:5432/gitinsight_test

      # pnpm 버전은 package.json의 packageManager(pnpm 10)를 따릅니다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # 계약 생성 파일(JSON Schema, TS 타입)이 커밋된 내용과 같은지 검사합니다.
      - name: Contracts check
        run: pnpm contracts:check
