# Alembic 설정 (#17). 저장소 루트에서 실행합니다:
#   uv run alembic -c api/alembic.ini upgrade head
# 접속 주소는 여기에 적지 않고 DATABASE_URL 환경 변수(.env)에서 읽습니다 (api/migrations/env.py).

[alembic]
script_location = %(here)s/migrations
# 마이그레이션 파일 이름: 0001_metric_events.py처럼 번호_설명
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
