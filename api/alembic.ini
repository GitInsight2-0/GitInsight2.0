# Alembic config (#17). Run from the repository root:
#   uv run alembic -c api/alembic.ini upgrade head
# The database URL is read from the DATABASE_URL environment variable (.env),
# never from this file. See api/migrations/env.py and AGENTS.md.
#
# Keep this file ASCII only. configparser reads it with the OS default encoding
# (cp949 on Korean Windows), so non-ASCII comments break alembic there.

[alembic]
script_location = %(here)s/migrations
# Migration file names: 0001_metric_events.py (revision id + slug)
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
