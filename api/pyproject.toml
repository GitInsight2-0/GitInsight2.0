[project]
name = "gitinsight-api"
version = "0.1.0"
description = "GitInsight 2.0 API 서버 (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gitinsight-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "litellm>=1.70",
]

[tool.uv.sources]
gitinsight-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitinsight_api"]
