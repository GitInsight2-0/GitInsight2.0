[project]
name = "gitinsight-contracts"
version = "0.1.0"
description = "GitInsight 2.0 모듈 간 계약 (Pydantic 모델)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitinsight_contracts"]
